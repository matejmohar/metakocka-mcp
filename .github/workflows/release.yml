name: Release
# Releases the version in package.json wherever it isn't out yet: builds the
# .mcpb, tags the commit v<version>, creates the GitHub release and publishes
# to npm. npm publishing uses trusted publishing (OIDC from this workflow), so
# no npm token is needed. Runs on every push to main, so merging a version bump
# (`npm version minor`) is all a release takes; pushing a v* tag still works too.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # npm trusted publishing

# A version bump pushed together with its tag starts two runs: the second waits and then skips.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check what is released already
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $tag"
            exit 1
          fi
          # Checked separately, so a run that failed halfway finishes the other half when re-run.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then github=false; else github=true; fi
          if [ "$(npm view "$name@$version" version 2> /dev/null)" = "$version" ]; then npm=false; else npm=true; fi
          echo "github=$github" >> "$GITHUB_OUTPUT"
          echo "npm=$npm" >> "$GITHUB_OUTPUT"
          if [ "$github" = true ] || [ "$npm" = true ]; then echo "release=true" >> "$GITHUB_OUTPUT"
          else echo "release=false" >> "$GITHUB_OUTPUT"; echo "::notice::$tag is already released; nothing to do."; fi
      - uses: actions/setup-node@v7
        if: steps.version.outputs.release == 'true'
        with:
          # Trusted publishing needs npm 11.5.1 or newer, which Node 24 ships with.
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
        if: steps.version.outputs.release == 'true'
      - run: npm run typecheck
        if: steps.version.outputs.release == 'true'
      - run: npm test
        if: steps.version.outputs.release == 'true'
      - run: npm run pack:mcpb
        if: steps.version.outputs.release == 'true'
      - name: Create GitHub release
        if: steps.version.outputs.github == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        # Creates the tag on this commit when it doesn't exist yet.
        run: gh release create "$TAG" release/*.mcpb --target "$GITHUB_SHA" --title "$TAG" --generate-notes
      - name: Publish to npm
        if: steps.version.outputs.npm == 'true'
        # Authenticates with this workflow's OIDC identity: the package's settings on npmjs.com must list
        # matejmohar/metakocka-mcp and release.yml as a trusted publisher. npm adds provenance on its own
        # when the repository is public.
        run: npm publish --access public
