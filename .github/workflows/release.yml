name: Release
# Push a tag like v0.3.0 (use `npm version minor`) to build the .mcpb,
# create a GitHub release and, if the NPM_TOKEN secret is set, publish to npm
# (with provenance when the repository is public).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Job-level so step conditions can see it: `if:` can't read secrets directly.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Check tag matches package version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm run typecheck
      - run: npm test
      - run: npm run pack:mcpb
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.mcpb --title "$GITHUB_REF_NAME" --generate-notes
      - name: Publish to npm
        if: ${{ env.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # npm only generates provenance for public repositories.
          PROVENANCE: ${{ github.event.repository.private && 'false' || 'true' }}
        run: |
          if [ "$PROVENANCE" = "true" ]; then
            npm publish --access public --provenance
          else
            npm publish --access public
          fi
      - name: Skip npm
        if: ${{ env.NPM_TOKEN == '' }}
        run: echo "::notice::Not published to npm — add an NPM_TOKEN repository secret to publish."
