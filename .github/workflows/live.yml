name: Live API check
# Read-only checks against a real Metakocka company (test/live), to catch API
# changes on Metakocka's side. Needs the repository secrets
# METAKOCKA_COMPANY_ID and METAKOCKA_SECRET_KEY — use a test company.
on:
  schedule:
    - cron: "0 5 * * *" # daily, 07:00 in Ljubljana (summer time)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    env:
      METAKOCKA_COMPANY_ID: ${{ secrets.METAKOCKA_COMPANY_ID }}
      METAKOCKA_SECRET_KEY: ${{ secrets.METAKOCKA_SECRET_KEY }}
    steps:
      - name: Check credentials
        id: creds
        run: |
          if [ -n "$METAKOCKA_COMPANY_ID" ] && [ -n "$METAKOCKA_SECRET_KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipped: add the METAKOCKA_COMPANY_ID and METAKOCKA_SECRET_KEY repository secrets to enable this check."
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.creds.outputs.ok == 'true'
      - run: npm run test:live
        if: steps.creds.outputs.ok == 'true'
